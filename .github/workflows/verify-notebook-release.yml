name: Verify published notebook release
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Published codingworkspace-notebook sha256 digest to verify
        required: true
        type: string
      prior_digest:
        description: Actual deployed prior notebook sha256 digest for retained-home upgrade
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: notebook-published-regression
  cancel-in-progress: false
jobs:
  regression:
    if: github.repository == 'ubc/jupyter-images' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: codingworkspace-publication
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PRIOR_DIGEST: ${{ inputs.prior_digest }}
    steps:
      - name: Validate trusted read-only verification request
        env:
          PUBLICATION_POLICY_ACK: ${{ vars.CODINGWORKSPACE_PUBLICATION_POLICY_ACK }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLICATION_POLICY_ACK" = main-only-no-admin-bypass-v1
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PRIOR_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-codingworkspace-publication
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Pull immutable candidate and actual production baseline
        run: |
          set -euo pipefail
          registry="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/codingworkspace-notebook"
          image="$registry@$IMAGE_DIGEST"
          prior="$registry@$PRIOR_DIGEST"
          docker pull "$image"
          docker pull "$prior"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          cw_ref=$(docker image inspect --format '{{index .Config.Labels "org.codingworkspace.source-revision"}}' "$image")
          gizmo_ref=$(docker image inspect --format '{{index .Config.Labels "org.codingworkspace.starter-revision"}}' "$image")
          [[ "$cw_ref" =~ ^[a-f0-9]{40}$ ]] && [[ "$gizmo_ref" =~ ^[a-f0-9]{40}$ ]]
          printf 'TEST_IMAGE=%s\nPRIOR_IMAGE=%s\nCW_REF=%s\nGIZMOAPP_REF=%s\n' "$image" "$prior" "$cw_ref" "$gizmo_ref" >> "$GITHUB_ENV"
          python_version=$(docker run --rm --entrypoint /opt/conda/bin/python "$image" -I -c 'import platform; print(platform.python_version())')
          echo "NOTEBOOK_PYTHON=$python_version" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/regression-evidence"
          printf 'image=%s\nprior_image=%s\ncw_ref=%s\ngizmo_ref=%s\nharness_ref=%s\n' "$image" "$prior" "$cw_ref" "$gizmo_ref" "$GITHUB_SHA" > "$RUNNER_TEMP/regression-evidence/identity.txt"
      - name: Prepare exact released tests without repository credentials
        env:
          CW_DEPLOY_KEY: ${{ secrets.CW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/regression-deploy-key"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          printf '%s\n' "$CW_DEPLOY_KEY" > "$keyfile"
          GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/codingworkspace-notebook/ci/github_known_hosts -o StrictHostKeyChecking=yes" \
            git clone --quiet --no-tags git@github.com:kevinlb1/CodingWorkspace.git "$RUNNER_TEMP/regression-git"
          git -C "$RUNNER_TEMP/regression-git" merge-base --is-ancestor "$CW_REF" origin/main
          git -C "$RUNNER_TEMP/regression-git" checkout --quiet --detach "$CW_REF"
          git -C "$RUNNER_TEMP/regression-git" remote remove origin
          umask 022
          mkdir "$RUNNER_TEMP/regression-source"
          git -C "$RUNNER_TEMP/regression-git" archive "$CW_REF" | tar -x -C "$RUNNER_TEMP/regression-source"
      - name: Verify installed bytes and exercise package installers
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /opt/conda/bin/python \
            -v "$RUNNER_TEMP/regression-source:/cw-source:ro" \
            -v "$GITHUB_WORKSPACE/codingworkspace-notebook:/recipe:ro" \
            "$TEST_IMAGE" -I /recipe/verify_installed_source.py installed --source /cw-source \
            2>&1 | tee "$RUNNER_TEMP/regression-evidence/installed-source.log"
          docker run --rm --network none --entrypoint /opt/conda/bin/python \
            -v "$GITHUB_WORKSPACE/codingworkspace-notebook/ci:/checks:ro" \
            "$TEST_IMAGE" -I /checks/check_dependency_compatibility.py \
            2>&1 | tee "$RUNNER_TEMP/regression-evidence/dependency-compatibility.log"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.NOTEBOOK_PYTHON }}
      - name: Prepare full-suite host prerequisites
        run: |
          set -euo pipefail
          # Central/group/Slurm tests require a system Python, real Git history,
          # and the separate worker package. They do not run in student pods.
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install --yes bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          git clone --quiet https://github.com/kevinlb1/SharedWorkerPool.git "$RUNNER_TEMP/worker-fixture"
          git -C "$RUNNER_TEMP/worker-fixture" checkout --quiet --detach ad083d16bb6debe77aa6b2a8a5a9ce09904f6972
          python -m pip install --disable-pip-version-check cryptography==50.0.1 PyYAML==6.0.3 ortools==9.15.6755 "$RUNNER_TEMP/worker-fixture"
          # Use the actual released OpenCode binary for the loopback model fixtures.
          fixture=$(docker create "$TEST_IMAGE")
          docker cp "$fixture:/usr/local/bin/opencode" "$RUNNER_TEMP/opencode"
          docker rm "$fixture"
          chmod 0755 "$RUNNER_TEMP/opencode"
          # The old test CA relies on OpenSSL defaults. Supply a conforming test
          # CA profile for Python 3.13 strict verification; never relax TLS checks.
          printf '%s\n' '[req]' 'distinguished_name=dn' 'x509_extensions=ca' '[dn]' '[ca]' \
            'basicConstraints=critical,CA:true' 'keyUsage=critical,keyCertSign,cRLSign' \
            'subjectKeyIdentifier=hash' 'authorityKeyIdentifier=keyid:always' > "$RUNNER_TEMP/test-openssl.cnf"
          printf 'suite_environment=ubuntu-24.04-python-%s\nworker_ref=%s\n' "$NOTEBOOK_PYTHON" \
            ad083d16bb6debe77aa6b2a8a5a9ce09904f6972 >> "$RUNNER_TEMP/regression-evidence/identity.txt"
      - name: Run complete released platform suite with matching Python version
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/suite-home"
          cd "$RUNNER_TEMP/regression-git"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/suite-home" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 OPENSSL_CONF="$RUNNER_TEMP/test-openssl.cnf" \
            CW_TEST_OPENCODE="$RUNNER_TEMP/opencode" CW_PROFILE_OPENCODE_BIN="$RUNNER_TEMP/opencode" \
            /bin/bash -ceu '
              git config --global user.name "Disposable test fixture"
              git config --global user.email "fixture@example.invalid"
              python -m unittest discover -s tests -v
            ' 2>&1 | tee "$RUNNER_TEMP/regression-evidence/full-suite.log"
      - name: Run complete baked starter suite in unmodified published image
        if: ${{ !cancelled() && env.TEST_IMAGE != '' }}
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /usr/bin/env "$TEST_IMAGE" \
            -i PATH=/opt/conda/bin:/usr/local/bin:/usr/bin:/bin HOME=/tmp/test-home LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 /bin/bash -ceu '
              mkdir -p "$HOME"
              git clone --quiet --no-local --no-hardlinks /opt/codingworkspace-starters/GizmoApp /tmp/starter
              cd /tmp/starter
              git config --global user.name "Disposable test fixture"
              git config --global user.email "fixture@example.invalid"
              /opt/codingworkspace-installed-dependencies/venv/bin/python -m unittest discover -s tests -v
            ' 2>&1 | tee "$RUNNER_TEMP/regression-evidence/starter-suite.log"
      - name: Verify installed V2 tools, isolation and prior-engine migration
        run: |
          set -euo pipefail
          bash codingworkspace-notebook/ci/verify-published-opencode.sh \
            "$TEST_IMAGE" "$PRIOR_IMAGE" "$RUNNER_TEMP/regression-source" \
            2>&1 | tee "$RUNNER_TEMP/regression-evidence/persistent-runtime.log"
      - name: Exercise actual prior-image upgrade and lifecycle
        if: ${{ !cancelled() && env.TEST_IMAGE != '' }}
        run: |
          set -euo pipefail
          # Only this disposable runner is adjusted to permit the Hub namespace topology.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sed 's/POD_SECCOMP=(--security-opt seccomp=unconfined)/POD_SECCOMP=(--security-opt seccomp=unconfined --security-opt apparmor=unconfined)/' \
            codingworkspace-notebook/ci/smoke-image.sh > codingworkspace-notebook/ci/smoke-release-regression.sh
          bash codingworkspace-notebook/ci/smoke-release-regression.sh lifecycle "$TEST_IMAGE" "$CW_REF" "$GIZMOAPP_REF" "$PRIOR_IMAGE" \
            2>&1 | tee "$RUNNER_TEMP/regression-evidence/lifecycle.log"
      - name: Checksum complete regression evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/regression-evidence"
          sha256sum *.log identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: notebook-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/regression-evidence/
          if-no-files-found: error
          retention-days: 90
